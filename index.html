<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Packliste">
<meta name="robots" content="noindex">
<title>Packliste – Personal Packing Manager</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<style>
/* Fiori-Horizon-Look – identische Tokens wie die Qt-EXE (app/ui/style.py) */
:root {
  --accent:#0064D9; --accent-hover:#0054B6; --accent-soft:#EBF8FF;
  --text:#1D2D3E; --text-2:#556B82; --bg:#F5F6F7; --surface:#FFFFFF;
  --line:#D9D9D9; --card-border:#E5E5E5; --input-border:#89919A; --hover:#EAECEE;
  --ok:#256F3A; --ok-bg:#F5FAE5; --warn:#E76500; --warn-bg:#FFF3B8;
  --err:#AA0808; --err-bg:#FFEAF4; --info:#0070F2; --info-bg:#E1F4FF;
  --r-tile:16px; --r-card:12px; --r-btn:8px; --r-input:6px;
  --font:"Segoe UI","72",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --shell:52px; --nav:210px; --master:300px;
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.4 var(--font); -webkit-text-size-adjust:100%; }
button,input,select,textarea { font:inherit; color:inherit; }
a { color:var(--accent); }

/* Shell Bar */
.shellbar { position:fixed; inset:0 0 auto 0; height:calc(var(--shell) + env(safe-area-inset-top)); padding:env(safe-area-inset-top) 16px 0;
  background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; z-index:20; }
.shellbar .logo { color:var(--accent); font-size:22px; }
.shellbar .title { font-size:17px; font-weight:600; white-space:nowrap; }
.shellbar .sub { color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.shellbar .grow { flex:1; }
.status { font-size:12.5px; font-weight:600; padding:2px 10px; border-radius:10px; background:var(--ok-bg); color:var(--ok); white-space:nowrap; }
.status.off { background:var(--err-bg); color:var(--err); }

/* Seitennavigation */
.sidenav { position:fixed; top:calc(var(--shell) + env(safe-area-inset-top)); bottom:0; left:0; width:var(--nav); background:var(--surface);
  border-right:1px solid var(--line); padding-top:6px; z-index:10; }
.sidenav a { display:flex; gap:10px; align-items:center; padding:10px 14px; margin:2px 8px; border-radius:var(--r-btn); color:var(--text); text-decoration:none; }
.sidenav a:hover { background:var(--hover); }
.sidenav a.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.sidenav .sep { height:14px; }
.sidenav .ico { width:20px; text-align:center; }
main { padding-top:calc(var(--shell) + env(safe-area-inset-top)); padding-left:var(--nav); min-height:100%; }

/* Seiten */
.page { padding:24px; max-width:1400px; }
.page.launchpad { padding:24px 32px; }
h1, .h1 { font-size:21px; font-weight:600; margin:0 0 4px; }
h2, .h2 { font-size:15px; font-weight:600; margin:18px 0 10px; }
.sub2 { color:var(--text-2); }
.muted { color:var(--text-2); font-size:13px; }

/* Kacheln */
.tiles { display:flex; flex-wrap:wrap; gap:16px; }
.tile { width:190px; height:176px; background:var(--surface); border:1px solid var(--card-border); border-radius:var(--r-tile);
  padding:14px 16px; display:flex; flex-direction:column; cursor:pointer; text-decoration:none; color:var(--text); }
.tile:hover { border-color:var(--accent); }
.tile .t { font-size:15px; font-weight:600; }
.tile .s { color:var(--text-2); font-size:13.5px; }
.tile .k { margin-top:auto; font-size:32px; font-weight:300; color:var(--accent); }

/* Karten */
.card { background:var(--surface); border:1px solid var(--card-border); border-radius:var(--r-card); padding:14px 16px 16px; margin-bottom:16px; }
.card > h2:first-child, .card > .h2:first-child { margin-top:0; }
.kpis { display:flex; flex-wrap:wrap; gap:28px; }
.kpi .l { color:var(--text-2); font-size:12px; }
.kpi .v { font-size:20px; font-weight:600; }
.bar { height:6px; background:var(--hover); border-radius:3px; overflow:hidden; margin-top:6px; }
.bar i { display:block; height:100%; background:var(--accent); }

/* List-Detail */
.ld { display:grid; grid-template-columns:var(--master) 1fr; min-height:calc(100vh - var(--shell)); }
.master { border-right:1px solid var(--line); padding:16px 8px 16px 16px; }
.detail { min-width:0; }
.master .tools { display:flex; gap:8px; align-items:center; margin:8px 0; }
.mlist { background:var(--surface); border:1px solid var(--card-border); border-radius:var(--r-btn); overflow:hidden; }
.mlist a { display:block; padding:9px 12px; border-bottom:1px solid #F0F0F0; color:var(--text); text-decoration:none; border-left:3px solid transparent; }
.mlist a:last-child { border-bottom:none; }
.mlist a:hover { background:var(--hover); }
.mlist a.sel { background:var(--accent-soft); border-left-color:var(--accent); }
.mlist .z2 { color:var(--text-2); font-size:13px; }
.objheader { background:var(--surface); border-bottom:1px solid var(--line); padding:16px 24px 0; }
.objheader .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.objheader .row .grow { flex:1; }
.tabs { display:flex; gap:4px; overflow-x:auto; margin-top:8px; }
.tabs a { padding:10px 16px; color:var(--text-2); font-weight:600; text-decoration:none; border-bottom:3px solid transparent; white-space:nowrap; }
.tabs a:hover { color:var(--text); }
.tabs a.active { color:var(--accent); border-bottom-color:var(--accent); }
.content { padding:16px 24px; }
.btn.back { display:none; }
#pdflayout { width:auto; max-width:200px; }

/* Buttons */
.btn { background:var(--surface); color:var(--accent); border:1px solid #BCC3CA; border-radius:var(--r-btn); padding:6px 14px; min-height:34px;
  font-weight:600; cursor:pointer; white-space:nowrap; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
.btn:hover { background:var(--hover); }
.btn:disabled { color:#A9B4BE; border-color:var(--card-border); cursor:default; }
.btn.emph { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.emph:hover { background:var(--accent-hover); }
.btn.flat { border-color:transparent; background:transparent; }
.btn.flat:hover { background:var(--hover); }
.btn.neg { color:var(--err); }

/* Eingaben */
input[type=text], input[type=number], input[type=date], input[type=search], input[type=password], select, textarea {
  background:var(--surface); border:1px solid var(--input-border); border-radius:var(--r-input); padding:5px 8px; min-height:34px; width:100%; }
input:focus, select:focus, textarea:focus { outline:none; border:2px solid var(--accent); padding:4px 7px; }
textarea { min-height:70px; resize:vertical; }
.form { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px 24px; }
.form label { display:flex; flex-direction:column; gap:4px; color:var(--text-2); font-size:13.5px; }
.form label.span2 { grid-column:span 2; } .form label.span3 { grid-column:1 / -1; }
.chk { display:inline-flex; align-items:center; gap:8px; cursor:pointer; color:var(--text); }
.chk input { width:18px; height:18px; accent-color:var(--accent); }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { border:1px solid #BCC3CA; background:var(--surface); border-radius:16px; padding:4px 12px; cursor:pointer; font-size:13.5px; }
.chip.on { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:600; }
.grid-checks { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:8px; }
.grid-checks .chk { border:1px solid var(--card-border); border-radius:var(--r-btn); padding:9px 10px; background:var(--surface); }
.grid-checks .chk.on { border-color:var(--accent); background:var(--accent-soft); }

/* Tabellen */
table.t { width:100%; border-collapse:collapse; background:var(--surface); }
table.t th { text-align:left; color:var(--text-2); font-weight:600; border-bottom:1px solid var(--line); padding:7px 6px; font-size:13.5px; }
table.t td { border-bottom:1px solid #EEEEEE; padding:6px; vertical-align:middle; }
table.t td.r, table.t th.r { text-align:right; }

/* Packliste */
.kat { margin:14px 0 6px; font-weight:600; display:flex; gap:8px; align-items:baseline; }
.kat small { color:var(--text-2); font-weight:400; }
.pl { background:var(--surface); border:1px solid var(--card-border); border-radius:var(--r-btn); overflow:hidden; }
.pi { display:flex; align-items:center; gap:12px; padding:9px 12px; border-bottom:1px solid #F0F0F0; }
.pi:last-child { border-bottom:none; }
.pi input[type=checkbox] { width:22px; height:22px; flex:none; accent-color:var(--accent); }
.pi .n { flex:1; min-width:0; cursor:pointer; }
.pi .n b { font-weight:600; }
.pi .n .z2 { color:var(--text-2); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pi.done .n > span:first-child { color:var(--text-2); text-decoration:line-through; }
.pi .m { color:var(--text-2); white-space:nowrap; font-size:13.5px; }
.pi .prio-muss { color:var(--err); font-size:11px; font-weight:700; margin-left:6px; }
.pedit { background:#FAFBFC; border-bottom:1px solid #F0F0F0; padding:10px 12px 12px 46px; }
.pedit .form { grid-template-columns:repeat(4, minmax(0,1fr)); }

/* Strips & Badges */
.strip { border-radius:var(--r-btn); padding:8px 12px; margin:8px 0; border:1px solid; }
.strip.info { background:var(--info-bg); border-color:var(--info); }
.strip.ok { background:var(--ok-bg); border-color:var(--ok); }
.strip.warn { background:var(--warn-bg); border-color:var(--warn); }
.strip.error { background:var(--err-bg); border-color:var(--err); }
.badge { border-radius:10px; padding:2px 10px; font-weight:600; font-size:12.5px; }
.badge.ok { background:var(--ok-bg); color:var(--ok); } .badge.draft { background:var(--warn-bg); color:#8D2A00; }
.badge.none { background:var(--hover); color:var(--text-2); }
.hidden { display:none !important; }
.empty { color:var(--text-2); padding:24px; text-align:center; }

/* Mobil (iPhone): Navigation unten, List-Detail als zwei Seiten */
@media (max-width: 820px) {
  .sidenav { top:auto; bottom:0; width:100%; height:calc(58px + env(safe-area-inset-bottom)); display:flex; padding:0 0 env(safe-area-inset-bottom);
    border-right:none; border-top:1px solid var(--line); }
  .sidenav a { flex:1; flex-direction:column; gap:2px; margin:4px 2px; padding:6px 2px; font-size:11px; justify-content:center; }
  .sidenav .ico { font-size:18px; }
  .sidenav .sep, .sidenav .desk { display:none; }
  main { padding-left:0; padding-bottom:calc(64px + env(safe-area-inset-bottom)); }
  .shellbar .sub { display:none; }
  .page, .page.launchpad { padding:16px; }
  .tiles { gap:12px; } .tile { width:calc(50% - 6px); height:140px; } .tile .k { font-size:26px; }
  .ld { display:block; }
  .ld.has-detail .master { display:none; }
  .ld:not(.has-detail) .detail { display:none; }
  .master { border-right:none; padding:16px; }
  .objheader { padding:12px 16px 0; } .content { padding:12px 16px; }
  .btn.back { display:inline-flex; }
  .form, .pedit .form { grid-template-columns:1fr 1fr; }
  .form label.span3, .form label.span2 { grid-column:1 / -1; }
  .pedit { padding-left:12px; }
  .hide-mobile { display:none; }
}
@media print {
  .shellbar, .sidenav, .master, .tabs, .btn, .objheader .row .grow ~ * { display:none !important; }
  main { padding:0; } .ld { display:block; }
}

/* One-Pager: Kacheln mit Fortschrittsbalken, Druckansicht (Drucken → „Als PDF sichern“ auch am iPhone) */
.tile .bar { margin-top:8px; }
.objheader { margin:0; }
.druck { display:none; }
@media print {
  body { background:#fff; }
  .shellbar, .sidenav, .objheader, .content, #msg { display:none !important; }
  main { padding:0 !important; }
  .druck { display:block; font:9pt/1.3 Helvetica, Arial, sans-serif; color:#32363A; }
  .dkopf { display:flex; justify-content:space-between; border-bottom:1.5px solid #0A6ED1; padding-bottom:6px; margin-bottom:8px; }
  .dtitel { text-align:right; font-weight:700; font-size:13pt; } .dtitel small { font-weight:400; font-size:8pt; color:#6A6D70; }
  .dspalten { columns:2; column-gap:10mm; }
  .dgruppe { break-inside:avoid; margin-bottom:6px; }
  .dkat { font-weight:700; font-size:10pt; margin:4px 0 2px; }
  .dz { display:flex; gap:6px; align-items:center; border-bottom:0.5px solid #D9D9D9; padding:2px 0; }
  .dz .b { font-weight:700; } .dz .dm { margin-left:auto; color:#6A6D70; font-size:8pt; white-space:nowrap; }
  .box { width:3.2mm; height:3.2mm; border:0.7px solid #6A6D70; border-radius:1px; display:inline-flex; align-items:center;
         justify-content:center; font-size:7pt; color:#0A6ED1; flex:none; }
  @page { size:A4; margin:14mm; }
}

</style>
</head>
<body>
<header class="shellbar"><span class="logo">◆</span><span class="title">Packliste</span><span class="sub">offline · Daten nur in diesem Browser</span>
<span class="grow"></span><span class="status" id="status"></span></header>
<nav class="sidenav" id="nav">
<a href="#/" data-k="reisen"><span class="ico">✈</span>Reisen</a>
<a href="#/neu" data-k="neu"><span class="ico">+</span>Neue Reise</a>
<div class="sep"></div>
<a href="#/daten" data-k="daten"><span class="ico">⇅</span>Import / Export</a>
</nav>
<main id="app"></main>
<script>
/* Packlogik für den One-Pager – 1:1-Port von app/packlogik.py + seed.aufgaben_fuer (getestet gegen Python,
   siehe tests/test_onepager.py). Reine Funktionen, keine DOM-Zugriffe. */
'use strict';
const PL = (() => {
  const KAT_STANDARD = ['Dokumente', 'Geld', 'Elektronik', 'Kleidung', 'Schuhe', 'Hygiene', 'Gesundheit', 'Accessoires',
    'Strand', 'Outdoor', 'Camping', 'Auto', 'Business', 'Sonstiges'];
  const PRIO = { muss: 'Muss mit', sollte: 'Sollte mit', optional: 'Optional' };

  function reisetage(abreise, rueckreise, fallback = 1) {
    const ok = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
    if (!ok(abreise) || !ok(rueckreise)) return Math.max(parseInt(fallback || 1, 10), 1);
    const t = (Date.parse(rueckreise + 'T00:00:00Z') - Date.parse(abreise + 'T00:00:00Z')) / 864e5;
    return Math.max(Math.round(t) + 1, 1);
  }
  function moduleAufloesen(ids, module) {
    const erg = [], unbekannt = [], gesehen = new Set();
    const besuche = id => {
      if (gesehen.has(id)) return; gesehen.add(id);
      const m = module[id];
      if (!m || m.geloescht) { unbekannt.push(id); return; }
      erg.push(id); (m.benoetigt || []).forEach(besuche);
    };
    (ids || []).forEach(besuche);
    return [erg, unbekannt];
  }
  function mengeBerechnen(basis, g, tage, personen) {
    let m = Number(basis !== null && basis !== undefined && basis !== '' ? basis : (g.menge || 1));
    if (g.pro_tag) m *= Math.max(tage, 1);
    if (g.pro_person) m *= Math.max(personen, 1);
    let mx = g.max_menge;
    if (mx !== null && mx !== undefined && mx !== '' && mx !== 0) {
      mx = Number(mx);
      if (g.pro_person && g.pro_tag) mx *= Math.max(personen, 1);
      m = Math.min(m, mx);
    }
    return m > 0 ? Math.ceil(m - 1e-9) : 0;
  }
  const katRang = (k, reihe) => { const i = reihe.indexOf(k); return i < 0 ? [reihe.length, (k || '').toLowerCase()] : [i, '']; };
  function sortiere(ps, reihe = KAT_STANDARD) {
    const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;
    return [...ps].sort((a, b) => {
      const ra = katRang(a.kategorie || 'Sonstiges', reihe), rb = katRang(b.kategorie || 'Sonstiges', reihe);
      return (ra[0] - rb[0]) || cmp(ra[1], rb[1]) || cmp((a.name || '').toLowerCase(), (b.name || '').toLowerCase());
    });
  }
  function packlisteErzeugen(reise, gegenstaende, module, reihe = KAT_STANDARD) {
    const tage = reisetage(reise.abreise, reise.rueckreise, reise.tage || 1);
    const personen = Math.max(parseInt(reise.personen || 1, 10), 1);
    const aus = new Set(reise.ausgeschlossen || []);
    const [mids, unbekannt] = moduleAufloesen(reise.module || [], module);
    const sammel = new Map(); let dubletten = 0, nAus = 0; const fehlend = [];
    for (const mid of mids) {
      const m = module[mid];
      for (const e of m.positionen || []) {
        const g = gegenstaende[e.gegenstand_id];
        if (!g || g.geloescht) { fehlend.push({ modul: m.name, gegenstand_id: e.gegenstand_id }); continue; }
        if (aus.has(e.gegenstand_id)) { nAus++; continue; }
        const menge = mengeBerechnen(e.menge, g, tage, personen);
        if (sammel.has(e.gegenstand_id)) {
          dubletten++; const p = sammel.get(e.gegenstand_id);
          p.menge = Math.max(p.menge, menge);
          if (!p.quellen.includes(m.name)) p.quellen.push(m.name);
          continue;
        }
        sammel.set(e.gegenstand_id, { id: `${reise.id}:${e.gegenstand_id}`, reise_id: reise.id, gegenstand_id: e.gegenstand_id,
          name: g.name || '', kategorie: g.kategorie || 'Sonstiges', menge, einheit: g.einheit || 'Stück',
          gewicht_g: Number(g.gewicht_g || 0), prioritaet: g.prioritaet || 'sollte', verbrauch: !!g.verbrauch,
          quellen: [m.name], eigen: false });
      }
    }
    return { positionen: sortiere([...sammel.values()], reihe), module: mids.map(x => module[x].name), modul_ids: mids,
      unbekannte_module: unbekannt, fehlende_gegenstaende: fehlend, dubletten, ausgeschlossen: nAus, tage, personen };
  }
  function aufgabenFuer(reise, modulIds, vorlagen) {
    const gew = new Set(modulIds);
    return [...vorlagen].filter(v => !v.geloescht && v.aktiv !== false && (!(v.module || []).length || v.module.some(m => gew.has(m))))
      .sort((a, b) => ((a.reihenfolge || 0) - (b.reihenfolge || 0)) || (a.name || '').localeCompare(b.name || ''))
      .map(v => ({ id: `${reise.id}:aufg:${v.id}`, reise_id: reise.id, name: v.name, erledigt: false, vorlage: v.id }));
  }
  const APP_KAT = ['Reise & Flug', 'Navigation', 'Transport', 'Kommunikation', 'Bezahlen', 'Sprache', 'Wetter', 'Sicherheit', 'Arbeit', 'Sonstiges'];
  function appsFuer(reise, modulIds, apps) {
    const gew = new Set(modulIds), aus = new Set(reise.apps_ausgeschlossen || []);
    const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;
    return [...apps].filter(a => !a.geloescht && a.aktiv !== false && !aus.has(a.id) && (!(a.module || []).length || a.module.some(m => gew.has(m))))
      .sort((a, b) => ((a.reihenfolge || 0) - (b.reihenfolge || 0)) || cmp((a.name || '').toLowerCase(), (b.name || '').toLowerCase()))
      .map(a => ({ id: `${reise.id}:app:${a.id}`, reise_id: reise.id, app_id: a.id, name: a.name || '', kategorie: a.kategorie || 'Sonstiges',
        zweck: a.zweck || '', link: a.link || '', eigen: false }));
  }
  function appsSortieren(as) {
    const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;
    return [...as].sort((a, b) => { const ra = katRang(a.kategorie || 'Sonstiges', APP_KAT), rb = katRang(b.kategorie || 'Sonstiges', APP_KAT);
      return (ra[0] - rb[0]) || cmp(ra[1], rb[1]) || cmp((a.name || '').toLowerCase(), (b.name || '').toLowerCase()); });
  }
  function fortschritt(ps, gepaeck) {
    const a = ps.filter(p => !p.geloescht), n = a.length, gep = a.filter(p => p.gepackt).length;
    const je = {}; let gw = 0;
    a.forEach(p => { const x = Number(p.menge || 0) * Number(p.gewicht_g || 0); gw += x; const k = p.gepaeck || ''; je[k] = (je[k] || 0) + x; });
    const stuecke = (gepaeck || []).map(g => { const lg = g.limit_kg ? g.limit_kg * 1000 : null; const w = je[g.id] || 0;
      return { id: g.id, name: g.name, gewicht_g: w, limit_g: lg, ueberschritten: !!(lg && w > lg) }; });
    return { anzahl: n, gepackt: gep, prozent: n ? Math.round(gep / n * 100) : 0, gewicht_g: gw,
      offen_muss: a.filter(p => !p.gepackt && p.prioritaet === 'muss').length, besorgen: a.filter(p => p.besorgen).length,
      ohne_gepaeck_g: je[''] || 0, gepaeck: stuecke };
  }
  /* Zusammenführen zweier Sicherungen (Format 2): je Objekt gewinnt die jüngere Änderung – wie Store.import_alles. */
  function zusammenfuehren(lokal, datei) {
    const erg = { neu: 0, aktualisiert: 0, unveraendert: 0, geloescht: 0 };
    const v2 = Number(datei.version || 1) >= 2;
    for (const [typ, liste] of Object.entries(datei.objekte || {})) {
      const ziel = lokal.objekte[typ] ||= [];
      const idx = new Map(ziel.map((o, i) => [o.id, i]));
      for (const o of liste) {
        if (!o.id) continue;
        const i = idx.get(o.id), l = i === undefined ? null : ziel[i];
        if (v2) {
          if (!l && o.geloescht) continue;
          if (l && (l.geaendert || '') >= (o.geaendert || '')) { erg.unveraendert++; continue; }
        }
        const neu = { ...o, geaendert: v2 ? o.geaendert : jetzt() };
        if (l) ziel[i] = neu; else { idx.set(o.id, ziel.length); ziel.push(neu); }
        if (o.geloescht) erg.geloescht++; else if (l) erg.aktualisiert++; else erg.neu++;
      }
    }
    return erg;
  }
  const jetzt = () => new Date().toISOString().replace('Z', '+00:00');
  return { KAT_STANDARD, APP_KAT, PRIO, appsFuer, appsSortieren, reisetage, moduleAufloesen, mengeBerechnen, sortiere, packlisteErzeugen, aufgabenFuer,
    fortschritt, zusammenfuehren, jetzt };
})();

</script>
<script>
/* Personal Packing Manager – One-Pager (statisch, z. B. GitHub Pages). Keine Daten in der Seite: Die Sicherung wird
   lokal im Browser geöffnet (localStorage), bearbeitet und als Datei wieder exportiert → in EXE/Web einspielen. */
'use strict';
const SPEICHER = 'ppm_onepager_v1';
let S = null;                    // {format, version, objekte:{typ:[...]}, _meta:{datei, geladen, aenderungen}}
const UI = { filter: 'alle', suche: '', offen: null, aufgEdit: null, msg: null };

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = x => { x = Number(x || 0); return Number.isInteger(x) ? x.toLocaleString('de-AT') : x.toLocaleString('de-AT', { maximumFractionDigits: 2 }); };
const kg = g => ((g || 0) / 1000).toLocaleString('de-AT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' kg';
const de = iso => iso ? iso.split('-').reverse().join('.') : '';
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/-/g, '');
const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'de');

// ---------- Datenhaltung ----------
function laden() { try { S = JSON.parse(localStorage.getItem(SPEICHER) || 'null'); } catch { S = null; } }
function sichern() {
  try { localStorage.setItem(SPEICHER, JSON.stringify(S)); }

}
const alle = typ => (S?.objekte?.[typ] || []);

const get = (typ, id) => alle(typ).find(o => o.id === id);

const katReihe = () => aktiv('kategorie').sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0)).map(k => k.name);
function schreibe(typ, obj) {
  const liste = (S.objekte[typ] ||= []);

  const i = liste.findIndex(o => o.id === obj.id);

}
function loesche(typ, id) { const o = get(typ, id); if (o && !o.geloescht) schreibe(typ, { ...o, geloescht: true }); }

function meldung(text, art = 'info') { UI.msg = text ? { text, art } : null; const el = $('#msg'); if (el) el.outerHTML = msgHtml(); }

async function dateiOeffnen(file) {
  if (!file) return;

  try { d = JSON.parse(await file.text()); } catch { return meldung('Datei ist kein gültiges JSON.', 'error'); }
  if (d.format !== 'personal-packing-manager') return meldung('Das ist keine Packing-Manager-Sicherung.', 'error');
  if (!S) {
    S = { format: d.format, version: 2, objekte: {}, _meta: {} };
    const e = PL.zusammenfuehren(S, d);
    S._meta = { datei: file.name, geladen: PL.jetzt(), erstellt: d.erstellt, aenderungen: 0 };
    sichern(); UI.msg = { text: `Sicherung geöffnet: ${e.neu} Datensätze.`, art: 'ok' }; render();
  } else {
    const e = PL.zusammenfuehren(S, d);
    S._meta.datei = file.name; S._meta.erstellt = d.erstellt; sichern(); render();
    meldung(`Zusammengeführt: ${e.neu} neu, ${e.aktualisiert} aktualisiert, ${e.geloescht} gelöscht, ${e.unveraendert} unverändert (hier gleich oder jünger).`, 'ok');
  }
}
function exportDaten() {
  const o = { format: 'personal-packing-manager', version: 2, app_version: 'onepager', erstellt: PL.jetzt(), geraet: 'onepager', objekte: S.objekte };
  return new Blob([JSON.stringify(o, null, 1)], { type: 'application/json' });
}
async function exportieren() {
  const blob = exportDaten(), name = 'PackingManager-Sicherung.json';
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: name }); } catch (e) { if (e.name !== 'AbortError') meldung(e.message, 'error'); return; }
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  S._meta.aenderungen = 0; S._meta.exportiert = PL.jetzt(); sichern(); render();
  meldung('Exportiert. Die Datei in der EXE („Datensicherung → Sicherung einspielen“) oder im Web („System“) einspielen.', 'ok');
}

// ---------- Router ----------
const route = () => (location.hash.replace(/^#\/?/, '') || '').split('/');
window.addEventListener('hashchange', () => { UI.offen = null; UI.aufgEdit = null; UI.msg = null; render(); window.scrollTo(0, 0); });
function render() {

  $('#status').textContent = !S ? 'keine Daten' : n ? `${n} Änderung(en) nicht exportiert` : 'alles exportiert';
  $('#status').className = 'status' + (!S || n ? ' off' : '');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.k === (s === 'r' ? 'reisen' : s || 'reisen')));
  $('#app').innerHTML = !S ? pLeer() : s === 'r' && id ? pReise(id, tab || 'liste') : s === 'neu' ? pNeu() : s === 'daten' ? pDaten() : pReisen();
}

// ---------- Seiten ----------
function pLeer() {
  return `<div class="page launchpad"><h1>Packliste – unterwegs</h1>${msgHtml()}
  <div class="card" style="max-width:640px"><div class="h2">Sicherung öffnen</div>
   <p class="sub2">Die Datei <b>PackingManager-Sicherung.json</b> aus der EXE (<i>Datensicherung → Sicherung exportieren</i> oder automatischer Export)
   bzw. aus der Web-App (<i>System → Sicherung herunterladen</i>) wählen. Sie bleibt nur in diesem Browser – auf dieser Seite selbst stehen keine Daten.</p>
   <label class="btn emph">Datei wählen …<input type="file" accept=".json,application/json" hidden onchange="dateiOeffnen(this.files[0])"></label>
   <p class="muted" style="margin-top:12px">Danach funktioniert alles offline: abhaken, ergänzen, Checkliste – und am Ende als Datei zurück exportieren.</p></div></div>`;
}
function pReisen() {
  const rs = aktiv('reise').sort((a, b) => (a.status === 'abgeschlossen') - (b.status === 'abgeschlossen') || (a.abreise || '9').localeCompare(b.abreise || '9'));
  return `<div class="page launchpad"><h1>Reisen</h1><div class="sub2">${esc(S._meta.datei || '')} · geöffnet ${new Date(S._meta.geladen).toLocaleString('de-AT')}</div>${msgHtml()}
  <div class="tiles" style="margin-top:12px">
    ${rs.map(r => { const f = PL.fortschritt(aktiv('position').filter(p => p.reise_id === r.id), r.gepaeck);
      return `<a class="tile" href="#/r/${r.id}"><span class="t">${esc(r.name)}</span><span class="s">${esc(r.ziel || '')}${r.abreise ? ' · ' + de(r.abreise) : ''}${r.status === 'abgeschlossen' ? ' · Archiv' : ''}</span>
      <span class="k">${f.prozent} %</span><div class="bar"><i style="width:${f.prozent}%"></i></div></a>`; }).join('')}
    <a class="tile" href="#/neu"><span class="t">Neue Reise</span><span class="s">aus Modulen erzeugen</span><span class="k">+</span></a>
  </div></div>`;
}

function pReise(rid, tab) {
  const r = get('reise', rid);
  if (!r || r.geloescht) return `<div class="page"><div class="empty">Reise nicht gefunden. <a href="#/">Zurück</a></div></div>`;
  const ps = aktiv('position').filter(p => p.reise_id === rid);
  const f = PL.fortschritt(ps, r.gepaeck);

  return `<div class="objheader"><div class="row"><a class="btn flat" href="#/">‹</a><span class="h1">${esc(r.name)}</span>

function tListe(r, ps, f) {

    && (!q || `${p.name} ${p.kategorie} ${p.notiz || ''}`.toLowerCase().includes(q)));

  const chip = (k, t) => `<span class="chip ${fl === k ? 'on' : ''}" onclick="UI.filter='${k}';render()">${t}</span>`;

      <div class="kpi"><div class="l">Fortschritt</div><div class="v">${f.prozent} %</div><div class="bar" style="width:120px"><i style="width:${f.prozent}%"></i></div></div>
      <div class="kpi"><div class="l">Gepackt</div><div class="v">${f.gepackt} / ${f.anzahl}</div></div>
      <div class="kpi"><div class="l">Muss noch mit</div><div class="v" style="color:${f.offen_muss ? 'var(--err)' : 'var(--ok)'}">${f.offen_muss}</div></div>
      <div class="kpi"><div class="l">Gewicht</div><div class="v">${kg(f.gewicht_g)}</div></div></div>
    ${warn.length ? `<div class="strip warn">Gewichtslimit überschritten – ${esc(warn.join(' · '))}</div>` : ''}</div>

    <div class="chips">${chip('alle', 'Alle')}${chip('offen', 'Offen')}${chip('muss', 'Muss offen')}${chip('besorgen', 'Besorgen')}</div></div>
  ${Object.entries(gr).map(([k, arr]) => `<div class="kat">${esc(k)} <small>${arr.filter(p => p.gepackt).length}/${arr.length}</small></div>
    <div class="pl">${arr.map(p => zeile(p, gn, r)).join('')}</div>`).join('') || '<div class="empty">Nichts gefunden.</div>'}
  <div class="card" style="margin-top:16px"><div class="h2">Eigener Gegenstand</div><div class="form">
    <label class="span2">Bezeichnung<input type="text" id="e_name" placeholder="z. B. Kamera"></label>
    <label>Kategorie<input type="text" id="e_kat" value="Sonstiges" list="kats"></label>
    <label>Menge<input type="number" id="e_menge" value="1" min="0"></label></div>
    <div style="margin-top:10px"><button class="btn emph" onclick="eigene('${r.id}')">Hinzufügen</button></div></div>
  <datalist id="kats">${katReihe().map(k => `<option value="${esc(k)}">`).join('')}</datalist>`;
}
function zeile(p, gn, r) {
  const z2 = [`${num(p.menge)} ${p.einheit || ''}`, gn[p.gepaeck], p.besorgen ? 'besorgen' : '', p.notiz].filter(Boolean).join(' · ');
  const edit = UI.offen === p.id ? `<div class="pedit"><div class="form">
      <label>Menge<input type="number" min="0" value="${p.menge}" onchange="posSet('${p.id}',{menge:Number(this.value),menge_manuell:true})"></label>
      <label>Gepäck<select onchange="posSet('${p.id}',{gepaeck:this.value||null})"><option value="">–</option>${(r.gepaeck || []).map(g => `<option value="${g.id}" ${g.id === p.gepaeck ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select></label>
      <label class="span3">Notiz<input type="text" value="${esc(p.notiz || '')}" onchange="posSet('${p.id}',{notiz:this.value})"></label></div>

      <label class="chk"><input type="checkbox" ${p.besorgen ? 'checked' : ''} onchange="posSet('${p.id}',{besorgen:this.checked})">noch besorgen</label>
      <span style="flex:1"></span><button class="btn flat neg" onclick="posWeg('${p.id}')">Entfernen</button></div></div>` : '';
  return `<div class="pi ${p.gepackt ? 'done' : ''}"><input type="checkbox" ${p.gepackt ? 'checked' : ''} onchange="posSet('${p.id}',{gepackt:this.checked})">
    <div class="n" onclick="UI.offen=UI.offen==='${p.id}'?null:'${p.id}';render()"><span><b>${esc(p.name)}</b>${p.prioritaet === 'muss' && !p.gepackt ? '<span class="prio-muss">MUSS</span>' : ''}</span>
    <div class="z2">${esc(z2)}</div></div><span class="m">${num(p.menge)}×</span></div>${edit}`;
}
function posSet(pid, f) { const p = get('position', pid); schreibe('position', { ...p, ...f }); render(); }
function posWeg(pid) {
  const p = get('position', pid);
  if (p.gegenstand_id && !p.eigen) {
    const r = get('reise', p.reise_id), aus = [...(r.ausgeschlossen || [])];
    if (!aus.includes(p.gegenstand_id)) { aus.push(p.gegenstand_id); schreibe('reise', { ...r, ausgeschlossen: aus }); }

function eigene(rid) {

function tAufgaben(r) {

      <button class="btn flat neg" onclick="loesche('aufgabe','${a.id}');render()">✕</button></div>`).join('') || '<div class="empty">Keine Aufgaben.</div>'}</div>
  <div style="display:flex;gap:8px;margin-top:12px"><input type="text" id="a_neu" placeholder="Neue Aufgabe, z. B. Nachbarn wegen Post fragen" onkeydown="if(event.key==='Enter')aufgNeu('${r.id}')">
  <button class="btn emph" onclick="aufgNeu('${r.id}')">Hinzufügen</button></div>`;
}
function aufgSet(aid, f) { schreibe('aufgabe', { ...get('aufgabe', aid), ...f }); render(); }
function aufgText(aid) { const t = $('#a_edit').value.trim(); if (t) aufgSet(aid, { name: t }); UI.aufgEdit = null; render(); }

function tApps(r) {

  <div class="card" style="margin-top:16px"><div class="h2">Eigene App</div><div class="form">
    <label>Name<input type="text" id="ea_name" placeholder="z. B. Agoda"></label><label class="span2">Zweck<input type="text" id="ea_zweck"></label></div>
    <div style="margin-top:10px"><button class="btn emph" onclick="appEigene('${r.id}')">Hinzufügen</button></div></div>
  ${aus.length ? `<div class="card"><div class="h2">Für diese Reise entfernt</div><table class="t">${aus.map(a => `<tr><td>${esc(a.name)}</td><td class="r"><button class="btn flat" onclick="appAufnehmen('${r.id}','${a.id}')">Wieder aufnehmen</button></td></tr>`).join('')}</table></div>` : ''}`;
}
function appZeile(a) {
  const z2 = [a.zweck, a.eingerichtet ? 'eingerichtet' : '', a.notiz].filter(Boolean).join(' · ');
  const link = a.link ? `<a class="btn flat" href="${esc(a.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Öffnen</a>` : '';
  const edit = UI.offen === a.id ? `<div class="pedit"><div class="form"><label class="span3">Notiz<input type="text" value="${esc(a.notiz || '')}" onchange="appSet('${a.id}',{notiz:this.value})"></label></div>
    <div style="display:flex;gap:12px;margin-top:10px;align-items:center;flex-wrap:wrap"><label class="chk"><input type="checkbox" ${a.eingerichtet ? 'checked' : ''} onchange="appSet('${a.id}',{eingerichtet:this.checked})">eingerichtet</label>

  return `<div class="pi ${a.installiert && a.eingerichtet ? 'done' : ''}"><input type="checkbox" ${a.installiert ? 'checked' : ''} onchange="appSet('${a.id}',{installiert:this.checked})">
    <div class="n" onclick="UI.offen=UI.offen==='${a.id}'?null:'${a.id}';render()"><span><b>${esc(a.name)}</b></span><div class="z2">${esc(z2)}</div></div>${link}</div>${edit}`;
}
function appSet(id, f) { schreibe('reiseapp', { ...get('reiseapp', id), ...f }); render(); }
function appWeg(id) {
  const a = get('reiseapp', id);
  if (a.app_id && !a.eigen) { const r = get('reise', a.reise_id), aus = [...(r.apps_ausgeschlossen || [])];
    if (!aus.includes(a.app_id)) schreibe('reise', { ...r, apps_ausgeschlossen: [...aus, a.app_id] }); }
  loesche('reiseapp', id); UI.offen = null; render(); meldung('Entfernt – unten wieder aufnehmbar.', 'info');
}
function appAufnehmen(rid, appId) {
  const r = get('reise', rid); schreibe('reise', { ...r, apps_ausgeschlossen: (r.apps_ausgeschlossen || []).filter(x => x !== appId) });
  const id = `${rid}:app:${appId}`, alt = get('reiseapp', id), k = get('app', appId);
  schreibe('reiseapp', { installiert: false, eingerichtet: false, notiz: '', ...(alt || {}), id, reise_id: rid, app_id: appId, name: k.name,
    kategorie: k.kategorie || 'Sonstiges', zweck: k.zweck || '', link: k.link || '', eigen: false, geloescht: false });
  render();
}
function appEigene(rid) {
  const name = $('#ea_name').value.trim(); if (!name) return meldung('Name fehlt.', 'error');
  schreibe('reiseapp', { id: uid(), reise_id: rid, app_id: null, name, kategorie: 'Sonstiges', zweck: $('#ea_zweck').value.trim(), link: '',
    installiert: false, eingerichtet: false, notiz: '', eigen: true });
  render(); meldung(`„${name}“ hinzugefügt.`, 'ok');
}
function druckApps(r) {
  const as = PL.appsSortieren(aktiv('reiseapp').filter(a => a.reise_id === r.id));
  const gr = {}; as.forEach(a => (gr[a.kategorie || 'Sonstiges'] ||= []).push(a));
  return `<div class="druck"><div class="dkopf"><div><b>${esc(r.name)}</b><br>${esc(r.ziel || '')}</div><div class="dtitel">Apps für die Reise<br><small>${as.filter(a => a.installiert).length}/${as.length} installiert · ${as.filter(a => a.eingerichtet).length}/${as.length} eingerichtet</small></div></div>
  ${Object.entries(gr).map(([k, arr]) => `<div class="dgruppe"><div class="dkat">${esc(k)}</div>${arr.map(a => `<div class="dz"><span class="box">${a.installiert ? '✓' : ''}</span>
    <span><span class="b">${esc(a.name)}</span>${a.zweck ? ` <span class="dm" style="margin:0">· ${esc(a.zweck)}</span>` : ''}${a.notiz ? ` <span class="dm" style="margin:0">· ${esc(a.notiz)}</span>` : ''}</span>
    <span class="dm">eingerichtet</span><span class="box">${a.eingerichtet ? '✓' : ''}</span></div>`).join('')}</div>`).join('')}</div>`;
}
function tGepaeck(r, ps, f) {
  return `<div class="card"><table class="t"><tr><th>Gepäckstück</th><th class="r">Positionen</th><th class="r">Gewicht</th><th class="r">Limit</th></tr>
    ${f.gepaeck.map(g => `<tr><td>${esc(g.name)}</td><td class="r">${ps.filter(p => p.gepaeck === g.id).length}</td>
      <td class="r" style="${g.ueberschritten ? 'color:var(--err);font-weight:600' : ''}">${kg(g.gewicht_g)}</td><td class="r">${g.limit_g ? kg(g.limit_g) : '–'}</td></tr>`).join('')}
    <tr><td class="muted">Nicht zugeordnet</td><td class="r">${ps.filter(p => !p.gepaeck).length}</td><td class="r">${kg(f.ohne_gepaeck_g)}</td><td></td></tr>
    <tr><td><b>Gesamt</b></td><td class="r">${ps.length}</td><td class="r"><b>${kg(f.gewicht_g)}</b></td><td></td></tr></table></div>
    <p class="muted">Zuordnung in der Packliste: Zeile antippen → Gepäck.</p>`;
}

function druck(r, ps, f) {
  const gr = {}; PL.sortiere(ps, katReihe()).forEach(p => (gr[p.kategorie || 'Sonstiges'] ||= []).push(p));
  const auf = aktiv('aufgabe').filter(a => a.reise_id === r.id);
  return `<div class="druck"><div class="dkopf"><div><b>${esc(r.name)}</b><br>${esc(r.ziel || '')}</div><div class="dtitel">Packliste<br><small>${[r.abreise ? de(r.abreise) + ' – ' + de(r.rueckreise) : '', `${f.gepackt}/${f.anzahl} gepackt`, kg(f.gewicht_g)].filter(Boolean).join(' · ')}</small></div></div>
  <div class="dspalten">${Object.entries(gr).map(([k, arr]) => `<div class="dgruppe"><div class="dkat">${esc(k)}</div>${arr.map(p => `<div class="dz"><span class="box">${p.gepackt ? '✓' : ''}</span><span class="${p.prioritaet === 'muss' ? 'b' : ''}">${esc(p.name)}</span><span class="dm">${num(p.menge)} ${esc(p.einheit || '')}</span></div>`).join('')}</div>`).join('')}</div>
  ${auf.length ? `<div class="dkat" style="margin-top:10px">Vor Abreise</div>${auf.map(a => `<div class="dz"><span class="box">${a.erledigt ? '✓' : ''}</span><span>${esc(a.name)}</span></div>`).join('')}` : ''}</div>`;
}

function pNeu() {
  const ms = aktiv('modul').sort(byName);
  return `<div class="page"><h1>Neue Reise</h1>${msgHtml()}<div class="card"><div class="form">
    <label>Name<input type="text" id="n_name" placeholder="z. B. Thailand 2027"></label>
    <label>Reiseziel<input type="text" id="n_ziel"></label>
    <label>Personen<input type="number" id="n_pers" min="1" value="1"></label>
    <label>Abreise<input type="date" id="n_ab"></label><label>Rückreise<input type="date" id="n_rueck"></label></div></div>
  <div class="card"><div class="h2">Module</div><p class="muted">Benötigte Module (z. B. „Allgemeine Reise") kommen automatisch dazu.</p>
    <div class="grid-checks">${ms.map(m => `<label class="chk"><input type="checkbox" class="n_mod" value="${m.id}" onchange="this.parentNode.classList.toggle('on',this.checked)">${esc(m.name)}</label>`).join('')}</div></div>
  <div style="display:flex;justify-content:flex-end"><button class="btn emph" onclick="neueReise()">Anlegen und Packliste erzeugen</button></div></div>`;
}
function neueReise() {
  const r = { id: uid(), name: $('#n_name').value.trim(), ziel: $('#n_ziel').value.trim(), abreise: $('#n_ab').value || null,
    rueckreise: $('#n_rueck').value || null, personen: Number($('#n_pers').value || 1), transport: '', status: 'planung',
    module: [...document.querySelectorAll('.n_mod:checked')].map(c => c.value), ausgeschlossen: [],
    gepaeck: [{ id: uid().slice(0, 8), name: 'Handgepäck', limit_kg: 8 }, { id: uid().slice(0, 8), name: 'Aufgabegepäck', limit_kg: 23 }] };
  if (!r.name) return meldung('Name fehlt.', 'error');
  if (!r.module.length) return meldung('Mindestens ein Modul wählen.', 'error');
  if (r.abreise && r.rueckreise && r.rueckreise < r.abreise) return meldung('Rückreise liegt vor der Abreise.', 'error');
  schreibe('reise', r);
  const e = PL.packlisteErzeugen(r, asDict('gegenstand'), asDict('modul'), katReihe());
  e.positionen.forEach(p => schreibe('position', { ...p, gepackt: false, gepaeck: null, notiz: '', besorgen: false, menge_manuell: false }));
  PL.aufgabenFuer(r, e.modul_ids, aktiv('aufgabenvorlage')).forEach(a => schreibe('aufgabe', a));
  PL.appsFuer(r, e.modul_ids, aktiv('app')).forEach(a => schreibe('reiseapp', { ...a, installiert: false, eingerichtet: false, notiz: '' }));
  location.hash = `#/r/${r.id}/liste`;
  setTimeout(() => meldung(`${e.positionen.length} Positionen aus ${e.module.length} Modulen (${e.module.join(', ')}); ${e.dubletten} Dubletten zusammengeführt; Apps im Reiter „Apps".`, 'ok'));
}

function pDaten() {
  const m = S._meta, n = m.aenderungen || 0;
  const z = Object.entries(S.objekte).map(([t, l]) => `${t}: ${l.filter(o => !o.geloescht).length}`).join(' · ');
  return `<div class="page"><h1>Daten</h1>${msgHtml()}
  <div class="card"><div class="h2">Exportieren</div><p class="sub2">${n ? `<b>${n} Änderung(en)</b> seit dem letzten Export.` : 'Keine neuen Änderungen.'}
    Die Datei danach in der EXE unter <i>Datensicherung → Sicherung einspielen</i> oder im Web unter <i>System</i> einspielen – je Datensatz gewinnt die jüngere Änderung.</p>
    <button class="btn emph" onclick="exportieren()">Sicherung exportieren</button></div>
  <div class="card"><div class="h2">Neuere Sicherung einspielen</div><p class="sub2">Führt eine neuere Datei mit dem Stand hier zusammen – hier gemachte, jüngere Änderungen bleiben erhalten.</p>
    <label class="btn">Datei wählen …<input type="file" accept=".json,application/json" hidden onchange="dateiOeffnen(this.files[0])"></label></div>
  <div class="card"><div class="h2">Gespeichert in diesem Browser</div><p class="muted">Datei: ${esc(m.datei || '–')} · erstellt ${m.erstellt ? new Date(m.erstellt).toLocaleString('de-AT') : '–'} · geöffnet ${new Date(m.geladen).toLocaleString('de-AT')}<br>${esc(z)}</p>
    <button class="btn flat neg" onclick="zuruecksetzen()">Alle Daten aus diesem Browser entfernen</button></div></div>`;
}
function zuruecksetzen() {
  const n = S._meta.aenderungen || 0;
  if (!confirm(n ? `${n} Änderung(en) sind noch nicht exportiert und gehen verloren. Trotzdem entfernen?` : 'Daten aus diesem Browser entfernen?')) return;
  localStorage.removeItem(SPEICHER); S = null; location.hash = '#/'; render();
}

laden(); render();

</script>
</body>
</html>
